<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer class="sidenav" fixedInViewport aria-label="Main navigation"
                 [attr.role]="'navigation'"
                 [mode]="compact() ? 'over' : 'side'"
                 [opened]="!compact()">
        <mat-toolbar><span class="brand-mark" aria-hidden="true">AT</span>Admin Tower</mat-toolbar>
        <mat-divider></mat-divider>
        <mat-nav-list aria-label="Main navigation">
            <a mat-list-item routerLink="/hosts" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="compact() && drawer.close()">Hosts</a>
            <a mat-list-item routerLink="/groups" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="compact() && drawer.close()">Groups</a>
            <a mat-list-item routerLink="/automation" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="compact() && drawer.close()">Automation</a>
        </mat-nav-list>
        <div class="nav-footer"><strong>SSH administration</strong><span>Local identities · Verified host trust</span></div>
        <mat-divider class="absolute inset-y-0 end-0 pointer-events-none" [vertical]="true"></mat-divider>
    </mat-sidenav>
    <mat-sidenav-content>
        <mat-toolbar>
            <button
                    type="button"
                    aria-label="Toggle sidenav"
                    [attr.aria-expanded]="drawer.opened"
                    matIconButton
                    (click)="drawer.toggle()">
                <mat-icon>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
                    </svg>
                </mat-icon>
            </button>
            <span class="workspace-label">Infrastructure workspace</span>
            <span class="workspace-hint">Admin Tower</span>
        </mat-toolbar>
        <main id="workspace-content">
            <ng-content></ng-content>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
