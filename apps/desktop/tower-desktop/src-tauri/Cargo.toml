[package]
name = "tower-desktop"
version = "0.0.0"
description = "Control Tower for System Administration."
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
